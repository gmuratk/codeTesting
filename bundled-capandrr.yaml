                - settled
                - unsettled
            linkProperties:
              type: object
              additionalProperties:
                type: string
    ApacheKafkaSettings:
      type: object
      allOf:
        - $ref: '#/components/schemas/ProtocolSettings'
        - properties:
            topicname:
              type: string
            partitionkeyextractor:
              type: string
            clientid:
              type: string
            ackmode:
              type: integer
          required:
